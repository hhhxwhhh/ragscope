[project]
name = "ragscope-backend"
version = "0.1.0"
description = "RAGScope backend: knowledge base Q&A with retrieval observability and evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "numpy>=1.26",
    "certifi>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
