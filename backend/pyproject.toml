[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ragscope-backend"
version = "0.1.0"
description = "RAGScope backend: knowledge base Q&A with retrieval observability and evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "chromadb>=1.0",
    # LangChain 1.x: LCEL chains, LangGraph agent, Chroma/embedding adapters.
    # langchain-huggingface does not pull sentence-transformers unless the
    # `full` extra is installed, so CI remains light.
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.7,<2",
    "langchain-huggingface>=1.2,<2",
    "langchain-chroma>=1.1,<2",
    "openai>=2.45",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "numpy>=1.26",
    "certifi>=2024.0",
]

[project.optional-dependencies]
# Heavy local-inference stack. Kept optional so CI and unit tests install in
# seconds; production and local RAG runs install `.[rag]`.
rag = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: asyncpg pool connections cannot be
# shared across loops, and the app engine is a process-wide singleton.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs the test PostgreSQL database and Redis DB 1",
]
