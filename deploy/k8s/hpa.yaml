apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ragscope-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ragscope-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ragscope-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ragscope-api }
