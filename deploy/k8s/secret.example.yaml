# Reference only — never commit real values.
# In a cluster, create this with an external secret manager (External Secrets,
# Sealed Secrets, Vault CSI) instead of applying this file.
apiVersion: v1
kind: Secret
metadata:
  name: ragscope-secrets
type: Opaque
stringData:
