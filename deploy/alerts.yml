# Example alert rules. Load with `rule_files: ["/etc/prometheus/alerts.yml"]`
# in prometheus.yml when running outside the demo stack.
groups:
  - name: ragscope-api
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(ragscope_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(ragscope_http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "5xx rate above 5% for 10 minutes"

      - alert: RetrievalLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(ragscope_http_request_duration_seconds_bucket{route="/api/v1/kbs/{kb_id}/chat/stream"}[5m])) by (le)
          ) > 8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 chat latency above 8s"

      - alert: IngestionFailures
        expr: increase(ragscope_ingest_total{status="failed"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 3 ingestion failures in 15 minutes"

      - alert: RefusalRateSpike
        expr: |
          sum(rate(ragscope_retrieval_refusal_total[15m]))
            / clamp_min(sum(rate(ragscope_retrieval_total[15m])), 0.001) > 0.4
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Over 40% of retrievals return no evidence"
