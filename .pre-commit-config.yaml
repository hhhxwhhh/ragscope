# Local hooks that mirror CI. Install with: pre-commit install
# Deliberately limited to fast, deterministic checks — anything slower belongs in
# CI, otherwise people start using `--no-verify`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^frontend/(package-lock\.json|dist/)
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
        # Formatting is advisory for now: run `ruff format` on files you touch.
        stages: [manual]

  - repo: local
    hooks:
      - id: backend-import-smoke
        name: backend import smoke test
        entry: bash -c 'cd backend && python -c "import app.main"'
        language: system
        pass_filenames: false
        files: ^backend/app/
      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd frontend && npx vue-tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^frontend/src/
